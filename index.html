<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blokus Web-Edition</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Blokus Online</h1>
    <div class="game">
        <div>
            <div id="board" class="board" tabindex="0" aria-label="Blokus board"></div>
            <div class="buttons">
                <button id="restartBtn">Restart</button> 
                <button id="endGameBtn">End game</button> 
                <button id="undoBtn">Undo</button> 
                <button id="passBtn">Pass</button> 
                <button id="flipBtn">Flip</button> 
                <button id="rotateBtn">Rotate</button>
            </div>
        </div>
        <div class="sidebar">
            <div class="controls">
                <div id="palette" class="pieces"></div>
            </div>
            <div class="scores">
              <div class="section-title">Leaderboard</div>
              <div id="scores"></div>
            </div>
        </div>
    </div>
    <div class="footer"><em>Click piece</em> to select ● <em>Click again</em> to rotate (optional) ● Drag piece to board or click cell to place</div>
    <script src="blokus.js"></script>
</body>
</html>
